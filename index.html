<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Line Tester 1013 — VoIP Quality Test Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="workbench">
  <div class="chassis">
    <div class="screw tl"></div><div class="screw tr"></div>
    <div class="screw bl"></div><div class="screw br"></div>

    <header class="brandplate">
      <span class="brand-main">LINE TESTER</span>
      <span class="brand-model">MODEL 1013&ndash;VOIP</span>
    </header>

    <div class="upper-deck">
      <!-- Analog VU-style meter -->
      <div class="meter-well">
        <svg viewBox="0 0 300 190" class="meter">
          <path d="M20,170 A130,130 0 0,1 45,72" class="arc arc-poor"/>
          <path d="M45,72 A130,130 0 0,1 130,20" class="arc arc-fair"/>
          <path d="M130,20 A130,130 0 0,1 255,72" class="arc arc-good"/>
          <path d="M255,72 A130,130 0 0,1 280,170" class="arc arc-exc"/>
          <g class="ticks"></g>
          <text x="30" y="186" class="meter-label">1</text>
          <text x="145" y="14" class="meter-label">MOS</text>
          <text x="262" y="186" class="meter-label">5</text>
          <g id="needle" class="needle" style="transform: rotate(-58deg)">
            <line x1="150" y1="170" x2="150" y2="45"/>
          </g>
          <circle cx="150" cy="170" r="9" class="hub"/>
        </svg>
        <div class="meter-caption">MEAN OPINION SCORE</div>
      </div>

      <!-- Digital readout -->
      <div class="lcd">
        <div class="lcd-row"><span>MOS</span><b id="val-mos">&mdash;.&mdash;</b></div>
        <div class="lcd-row"><span>R&#8209;FACTOR</span><b id="val-r">&mdash;&mdash;</b></div>
        <div class="lcd-row"><span>JITTER</span><b id="val-jitter">&mdash;&mdash; ms</b></div>
        <div class="lcd-row"><span>RTT</span><b id="val-rtt">&mdash;&mdash; ms</b></div>
        <div class="lcd-row"><span>PKT LOSS</span><b id="val-loss">&mdash;.&mdash;%</b></div>
        <div class="lcd-row"><span>CODEC</span><b id="val-codec">&mdash;&mdash;</b></div>
      </div>
    </div>

    <div class="switch-row">
      <div class="switch-block">
        <div class="switch-caption">CODEC PREF</div>
        <div class="toggle" id="toggle-codec" data-value="pcmu">
          <div class="toggle-option active" data-value="pcmu">PCMU</div>
          <div class="toggle-option" data-value="opus">OPUS</div>
        </div>
      </div>
      <div class="switch-block">
        <div class="switch-caption">TEST MODE</div>
        <div class="toggle" id="toggle-mode" data-value="dial">
          <div class="toggle-option active" data-value="dial">DIAL&nbsp;OUT</div>
          <div class="toggle-option" data-value="tone">1004Hz&nbsp;TONE</div>
        </div>
      </div>
      <div class="lamps">
        <div class="lamp" id="lamp-ready" title="ready"><span></span>READY</div>
        <div class="lamp" id="lamp-ring" title="ringing"><span></span>RINGING</div>
        <div class="lamp" id="lamp-conn" title="connected"><span></span>ON&nbsp;LINE</div>
      </div>
    </div>

    <div class="dial-deck">
      <input id="number" class="number-display" placeholder="+1 area code, then number" inputmode="tel" />
      <div class="keypad">
        <button class="key">1</button><button class="key">2</button><button class="key">3</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button>
        <button class="key">7</button><button class="key">8</button><button class="key">9</button>
        <button class="key">*</button><button class="key">0</button><button class="key">#</button>
      </div>
      <div class="big-buttons">
        <button id="btn-call" class="pushbutton call">CALL</button>
        <button id="btn-hangup" class="pushbutton hangup" disabled>HANG UP</button>
      </div>
    </div>

    <div class="teletype" id="log"></div>
  </div>
  <div class="feet"></div>
</div>

<script src="https://sdk.twilio.com/js/voice/releases/2.12.1/twilio.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
